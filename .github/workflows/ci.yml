name: Template validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate template and knowledge
        run: python3 scripts/validate_template.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Wiki statistics
        run: python3 scripts/validate_knowledge.py --stats
